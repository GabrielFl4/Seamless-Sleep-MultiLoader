# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.7.0
group=net.aqualoco.sec
java_version=25

# Common
minecraft_version=26.2
mod_name=Seamless Sleep
mod_author=AquaLoco
mod_id=seamlesssleep
license=All Rights Reserved
credits=To all 8b people in the world! (Love ya)
description=Rethinks the way players sleep, adding a smooth animation and visual improvements with minimal server impact.\n\nNow available for Fabric!\n*There are configs in this mod that can be tweaked*
minecraft_version_range=[26.2,26.3)
fabric_minecraft_version_range=>=26.2 <26.3
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
# TODO verify against https://projects.neoforged.net/neoforged/neoform for the exact 26.2 build number
neo_form_version=26.2-1
# The version of ParchmentMC that is used. Leave blank to disable layered parchment mappings.
parchment_minecraft=26.2
parchment_version=

# Confirmed on Modrinth (project "yacl", modrinth.com/mod/yacl) - 3.9.5+26.2-fabric
# targets stable Minecraft 26.2 on Fabric. modmenu_version confirmed via a modpack
# changelog referencing "ModMenu support (20.0.0-beta.2)" for MC 26.2; double check
# https://modrinth.com/mod/modmenu/versions for anything newer before you publish.
modmenu_version=20.0.0-beta.2
yacl_version=3.9.5+26.2-fabric

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.2+26.2
fabric_loader_version=0.19.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Libraries
night_config_version=3.8.2
